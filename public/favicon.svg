<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="pigShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Modern Blue Squircle Background -->
  <rect width="100" height="100" rx="24" fill="url(#blueGrad)"/>
  
  <g filter="url(#pigShadow)">
    <!-- Golden Coin Dropping into Coin Slot -->
    <circle cx="50" cy="18" r="8" fill="url(#goldCoin)" stroke="#f59e0b" stroke-width="1.2"/>
    <circle cx="50" cy="18" r="6" fill="none" stroke="#d97706" stroke-width="0.8" stroke-dasharray="2 1.5"/>
    <text x="50" y="21" font-size="7.5" font-weight="900" fill="#92400e" text-anchor="middle" font-family="system-ui, sans-serif">$</text>

    <!-- Piggy Bank (Saving Pig Mascot) -->
    <g transform="translate(17.5, 22) scale(2.7)" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="rgba(255, 255, 255, 0.22)">
      <path d="M11 17h3v2a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-3a3.16 3.16 0 0 0 2-2h1a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1h-1a5 5 0 0 0-2-4V3a4 4 0 0 0-3.2 1.6l-.3.4H11a6 6 0 0 0-6 6v1a5 5 0 0 0 2 4v3a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1z" />
      <path d="M16 10h.01" />
      <path d="M2 8v1a2 2 0 0 0 2 2h1" />
    </g>
  </g>
</svg>